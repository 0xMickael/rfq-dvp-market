[package]
name = "rfq-dvp-market-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
axum = { version = "=0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "=1.0.228", features = ["derive"] }
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
